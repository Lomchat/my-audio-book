# MyAudioBook — `docker compose up -d`, then open http://localhost:8000
# The first start downloads the speech models (~1.7 GB) into the data volume.

x-app: &app
  build: .
  image: myaudiobook:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    # A named volume by default. Set DATA_PATH=./data in .env to use a folder instead
    # (it must be writable by uid 10001: `sudo chown -R 10001 ./data`).
    - ${DATA_PATH:-mab-data}:/data

services:
  web:
    <<: *app
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    # Transcription is CPU-heavy: cap the cores it may use (match WHISPER_THREADS).
    cpus: ${WORKER_CPUS:-8}
    stop_grace_period: 30s

volumes:
  mab-data:
