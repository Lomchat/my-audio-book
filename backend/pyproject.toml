[project]
name = "myaudiobook"
version = "0.1.0"
description = "Upload or record audio from your phone: transcribed, summarized and sorted automatically."
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
